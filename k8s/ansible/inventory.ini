# Two logical hosts:
#  - build_host  : the Mac (Ansible control node) — docker build, flatten, save, helm/kubectl
#  - k8s_node    : the MicroK8s LXC node — receives image tarballs + `ctr images import` (sudo)
[build_host]
localhost ansible_connection=local

[k8s_node]
k8s-node ansible_host=192.168.1.201 ansible_user=sysadmin

[k8s_node:vars]
# ctr import needs root; Ansible become supplies the sudo password
# (prompt with --ask-become-pass, or store in ansible-vault).
ansible_become=true
