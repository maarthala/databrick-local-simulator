---
- name: Ensure namespace exists
  ansible.builtin.shell: "kubectl create namespace {{ namespace }} 2>/dev/null || true"
  changed_when: false

- name: Create/refresh the git-sync PAT secret (idempotent)
  ansible.builtin.shell: >
    kubectl -n {{ namespace }} create secret generic de-stack-git-token
    --from-literal=token='{{ git_pat_token }}'
    --dry-run=client -o yaml | kubectl apply -f -
  no_log: true
  changed_when: false
  when: git_pat_token is defined and git_pat_token | length > 0
