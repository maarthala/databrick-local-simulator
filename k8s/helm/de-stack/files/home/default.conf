# Home page (static files). It sits behind oauth2-proxy, which forwards the browser's cookies —
# the lab-account session cookie (holds the Keycloak tokens) plus sign-in (CSRF) cookies can
# pass nginx's default 8 KB header limit → "400 Request Header Or Cookie Too Large".
large_client_header_buffers 8 32k;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # pages and scripts change with the lab (e.g. a new menu link): always revalidate
    add_header Cache-Control "no-cache" always;
}
