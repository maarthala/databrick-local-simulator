# DE Learning Lab login theme — Keycloak's keycloak.v2 (PatternFly 5) with the landing
# page's colours. Only CSS is overridden; every page/template comes from the parent.
parent=keycloak.v2
import=common/keycloak
# parent's stylesheet first, then ours on top
styles=css/styles.css css/de-lab.css
# our CSS is dark-only — don't let PatternFly switch palettes with the OS setting
darkMode=false
