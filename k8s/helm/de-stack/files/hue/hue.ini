[desktop]
secret_key = some-key
http_host = 0.0.0.0
http_port = 8888
time_zone = America/Los_Angeles
django_debug_mode = false
http_500_debug_mode = false
# NOTE: do not blacklist 'beeswax' — Hue's notebook app imports it at startup
# and will crash. This is the image's default set plus 'impala'.
app_blacklist=impala,search,hbase,security

  [[auth]]
  idle_session_timeout = -1

  [[database]]
  engine = postgresql_psycopg2
  host = postgres
  port = 5432
  user = postgres
  password = postgres
  name = hue

[notebook]
autocompleter={'skip_system_databases': True}
disable_builtin_interpreters=True

  [[interpreters]]

    [[[postgresql_northwind]]]
    name = northwinddb
    interface = sqlalchemy
    options = {"url": "postgresql://postgres:postgres@postgres:5432/northwind"}

    [[[trino]]]
    name = Trino
    interface = trino
    options = {"url": "http://trino:8080"}

    [[[clickhouse]]]
    name = ClickHouse
    interface = sqlalchemy
    options = {"url": "clickhouse://default:default@clickhouse:8123"}

# Hive editor (beeswax app). Point it at the HiveServer2 running in the
# hive-metastore container; default is localhost:10000 which is wrong inside Hue.
[beeswax]
  hive_server_host=hive-metastore
  hive_server_port=10000
  hive_metastore_host=hive-metastore
  hive_metastore_port=9083

