spark.ui.reverseProxy true
spark.ui.reverseProxyUrl http://spark.de.lan
spark.ui.showConsoleProgress true
spark.master spark://spark-master:7077
fs.s3a.threads.keepalivetime 60000
fs.s3a.multipart.purge.age 24
spark.sql.catalogImplementation hive
spark.hadoop.fs.s3a.connection.timeout  60000
spark.hadoop.fs.s3a.connection.establish.timeout 60000
spark.hadoop.fs.s3a.connection.request.timeout 60000
spark.hadoop.fs.s3a.connection.maximum 60
spark.hadoop.fs.s3a.connection.timeout 60000
spark.hadoop.hive.metastore.uris thrift://hive-metastore:9083
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minioadmin
spark.hadoop.fs.s3a.secret.key minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# --- Apache Iceberg (catalog name: "iceberg", backed by the Iceberg REST catalog, stored on MinIO) ---
# Usage: spark.sql("CREATE TABLE iceberg.db.tbl (...) USING iceberg")
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# Backed by Apache Polaris (governed Iceberg REST). Catalog name stays `iceberg` so
# all course code is unchanged. Polaris vends scoped MinIO creds (no static keys).
spark.sql.catalog.iceberg org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type rest
spark.sql.catalog.iceberg.uri http://polaris:8181/api/catalog
spark.sql.catalog.iceberg.warehouse polaris_lake
spark.sql.catalog.iceberg.credential root:s3cr3t
spark.sql.catalog.iceberg.scope PRINCIPAL_ROLE:ALL
spark.sql.catalog.iceberg.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.iceberg.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.client.region us-east-1