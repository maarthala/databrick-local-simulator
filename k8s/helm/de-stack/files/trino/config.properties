coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
# Trust X-Forwarded-* from the nginx ingress; without this Trino returns HTTP 406
# for any proxied request (e.g. the web UI at trino.de.lan).
http-server.process-forwarded=true
query.max-memory=1GB
query.max-memory-per-node=512MB
discovery.uri=http://localhost:8080
# Partial (pre-)aggregation over-allocates on the k8s node — AdventureWorks challenge queries
# 15/35 died with "exceeded per-node memory limit" (1.9 GB request for tiny tables). Off = fine.
optimizer.prefer-partial-aggregation=false
# Each learner catalog (kiran_lake …) is added at run time by home-api (CREATE CATALOG). They are
# written into the container (lost on restart) — home-api re-adds them within a minute.
catalog.management=dynamic
