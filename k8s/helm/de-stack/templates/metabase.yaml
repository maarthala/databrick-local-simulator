{{- if .Values.metabase.enabled }}
# Metabase — friendly web UI for querying Trino (Starburst/Trino driver is built in).
# Keeps its own state in the `metabase` Postgres DB (see files/postgres/01_postgres-init.sql).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "metabase") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "metabase") | nindent 8 }}
    spec:
      containers:
        - name: metabase
          image: {{ .Values.metabase.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: MB_DB_TYPE,   value: "postgres" }
            - { name: MB_DB_HOST,   value: "postgres" }
            - { name: MB_DB_PORT,   value: "5432" }
            - { name: MB_DB_DBNAME, value: "metabase" }
            - { name: MB_DB_USER,   value: "metabase" }
            - { name: MB_DB_PASS,   value: "metabase" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "metabase") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: metabase.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: metabase, port: { number: 3000 } }
{{- end }}
---
# Provision Metabase non-interactively: create the admin AND add the Trino catalog
# connections, so a fresh deploy is ready to use. Both steps are idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: metabase-admin
  labels: {{- include "de-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "metabase-admin") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              MB=http://metabase:3000
              EMAIL="{{ .Values.metabase.adminEmail }}"
              PW="{{ .Values.metabase.adminPassword }}"
              CATALOGS="{{ .Values.metabase.trinoCatalogs }}"
              echo "waiting for metabase..."
              until curl -fsS $MB/api/health >/dev/null 2>&1; do sleep 5; done
              # 1. admin (only while the setup token exists)
              token=$(curl -fsS $MB/api/session/properties | grep -o '"setup-token":"[^"]*"' | cut -d'"' -f4)
              if [ -n "$token" ]; then
                curl -fsS -X POST $MB/api/setup -H 'Content-Type: application/json' -d "{\"token\":\"$token\",\"user\":{\"first_name\":\"Admin\",\"last_name\":\"User\",\"email\":\"$EMAIL\",\"password\":\"$PW\",\"site_name\":\"DE Lab\"},\"prefs\":{\"site_name\":\"DE Lab\",\"allow_tracking\":false}}" >/dev/null
                echo "admin created: $EMAIL"
              else
                echo "already set up — skipping admin creation"
              fi
              # 2. Trino catalog connections (idempotent)
              session=$(curl -fsS -X POST $MB/api/session -H 'Content-Type: application/json' -d "{\"username\":\"$EMAIL\",\"password\":\"$PW\"}" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              if [ -z "$session" ]; then echo "could not authenticate — skipping connections"; exit 0; fi
              existing=$(curl -fsS -H "X-Metabase-Session: $session" $MB/api/database | grep -o '"name":"[^"]*"' | cut -d'"' -f4)
              for cat in $CATALOGS; do
                name="Trino - $cat"
                if echo "$existing" | grep -qxF "$name"; then echo "  $name exists — skipping"; continue; fi
                if curl -fsS -X POST $MB/api/database -H "X-Metabase-Session: $session" -H 'Content-Type: application/json' -d "{\"name\":\"$name\",\"engine\":\"starburst\",\"details\":{\"host\":\"trino\",\"port\":8080,\"catalog\":\"$cat\",\"user\":\"metabase\",\"ssl\":false}}" >/dev/null 2>&1; then
                  echo "  added: $name"
                else
                  echo "  failed to add $name (catalog may not exist) — skipping"
                fi
              done
{{- end }}
