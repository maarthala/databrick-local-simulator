{{- if .Values.spark.enabled }}
{{- $img := include "de-stack.image" (dict "root" $ "repo" .Values.spark.repo "tag" .Values.spark.tag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "spark-master") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "spark-master") | nindent 8 }}
    spec:
      # A Service named "spark-master" injects SPARK_MASTER_PORT=tcp://... link vars,
      # which Spark parses as a port number and crashes. Disable service links.
      enableServiceLinks: false
      {{- with .Values.spark.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spark-master
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Run the master in the FOREGROUND bound to the pod IP (--host spark-master
          # would bind the Service ClusterIP, which isn't a local interface -> bind
          # failure). Jar conflicts (hive-exec, netty) are fixed in the image itself.
          command: ["/bin/bash", "-c", "exec /opt/spark/sbin/start-master.sh --host $POD_IP"]
          env:
            - { name: SPARK_CONF_DIR, value: /opt/spark/conf }
            - { name: SPARK_NO_DAEMONIZE, value: "true" }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_ACCESS_KEY_ID, value: "{{ .Values.minio.rootUser }}" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.minio.rootPassword }}" }
          ports:
            - { name: cluster, containerPort: 7077 }
            - { name: ui, containerPort: 8080 }
          volumeMounts:
            - { name: spark-conf, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf }
            - { name: hive-site, mountPath: /opt/spark/conf/hive-site.xml, subPath: hive-site.xml }
      volumes:
        - { name: spark-conf, configMap: { name: spark-config } }
        - { name: hive-site, configMap: { name: hive-config } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spark.workers }}
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "spark-worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "spark-worker") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- with .Values.spark.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spark-worker
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-c", "exec /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --host $POD_IP"]
          env:
            - { name: SPARK_CONF_DIR, value: /opt/spark/conf }
            - { name: SPARK_NO_DAEMONIZE, value: "true" }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_ACCESS_KEY_ID, value: "{{ .Values.minio.rootUser }}" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.minio.rootPassword }}" }
          volumeMounts:
            - { name: spark-conf, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf }
            - { name: hive-site, mountPath: /opt/spark/conf/hive-site.xml, subPath: hive-site.xml }
      volumes:
        - { name: spark-conf, configMap: { name: spark-config } }
        - { name: hive-site, configMap: { name: hive-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "spark-master") | nindent 4 }}
  ports:
    - { name: cluster, port: 7077, targetPort: 7077 }
    - { name: ui, port: 8080, targetPort: 8080 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-ui
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: spark.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spark-master, port: { number: 8080 } }
{{- end }}
{{- end }}
