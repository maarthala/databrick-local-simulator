{{- if .Values.hue.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hue-config
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  zz-hue.ini: |
{{ .Files.Get "files/hue/hue.ini" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-ui
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "db-ui") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "db-ui") | nindent 8 }}
    spec:
      containers:
        - name: hue
          image: {{ include "de-stack.image" (dict "root" $ "repo" .Values.hue.repo "tag" .Values.hue.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: POSTGRES_HOST, value: "postgres" }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: "postgres" }
            - { name: POSTGRES_DB, value: "hue" }
          ports:
            - { name: http, containerPort: 8888 }
          volumeMounts:
            - { name: hue-ini, mountPath: /usr/share/hue/desktop/conf/zz-hue.ini, subPath: zz-hue.ini }
          readinessProbe:
            httpGet: { path: /, port: 8888 }
            initialDelaySeconds: 40
            periodSeconds: 15
      volumes:
        - { name: hue-ini, configMap: { name: hue-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: db-ui
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "db-ui") | nindent 4 }}
  ports:
    - { name: http, port: 8888, targetPort: 8888 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hue
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: hue.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: db-ui, port: { number: 8888 } }
{{- end }}
{{- end }}
