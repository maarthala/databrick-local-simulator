{{- if .Values.sparkConnect.enabled }}
{{- $img := include "de-stack.image" (dict "root" $ "repo" .Values.spark.repo "tag" .Values.spark.tag) }}
# Spark Connect server — the Spark "engine" that thin clients (Jupyter) drive over
# gRPC (sc://spark-connect:15002). Reuses the spark image (already jar-fixed) and its
# spark-defaults (Iceberg REST catalog -> MinIO), so notebooks get the full lakehouse
# without any Spark installed locally. Runs as a client-mode driver on the standalone
# cluster (spark://spark-master:7077), so notebook jobs execute on spark-worker and
# show up in the Spark master UI. driver.host is pinned to the pod IP (a bare pod has
# no DNS) so executors can connect back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-connect
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "spark-connect") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "spark-connect") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- with .Values.spark.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spark-connect
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # start-connect-server.sh in the foreground (SPARK_NO_DAEMONIZE), as a
          # client-mode driver on the standalone cluster so jobs land on spark-worker.
          # catalogImplementation=in-memory: this stack has no Hive Metastore (disabled),
          # so avoid the Hive session-catalog init; the lakehouse uses the iceberg REST catalog.
          command: ["/bin/bash", "-c", "export SPARK_NO_DAEMONIZE=1; exec /opt/spark/sbin/start-connect-server.sh --master spark://spark-master:7077 --conf spark.driver.host=$POD_IP --conf spark.driver.bindAddress=0.0.0.0 --conf spark.sql.catalogImplementation=in-memory"]
          env:
            - { name: SPARK_CONF_DIR, value: /opt/spark/conf }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_ACCESS_KEY_ID, value: "{{ .Values.minio.rootUser }}" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.minio.rootPassword }}" }
          ports:
            - { name: grpc, containerPort: 15002 }
            - { name: ui, containerPort: 4040 }
          volumeMounts:
            - { name: spark-conf, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf }
            - { name: hive-site, mountPath: /opt/spark/conf/hive-site.xml, subPath: hive-site.xml }
      volumes:
        - { name: spark-conf, configMap: { name: spark-config } }
        - { name: hive-site, configMap: { name: hive-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-connect
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "spark-connect") | nindent 4 }}
  ports:
    - { name: grpc, port: 15002, targetPort: 15002 }
    - { name: ui, port: 4040, targetPort: 4040 }
{{- end }}
