{{- if .Values.keycloak.enabled }}
# Keycloak — learner logins + self-registration (realm de-lab). Front door for the
# landing page (oauth2-proxy, see home.yaml); later phases point the tools at it too.
#
# Hostnames: browsers use http://auth.<baseHost> (the ingress); pods call the keycloak
# Service directly. KC_HOSTNAME pins the PUBLIC issuer in every token, and
# BACKCHANNEL_DYNAMIC lets pods use the internal address for token/keys calls — so no
# hostAlias / CoreDNS tricks (the JWKS-through-nginx problem of the old setup).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  de-lab-realm.json: |
{{ .Files.Get "files/keycloak/de-lab-realm.json" | replace "http://de.lan" (printf "http://%s" .Values.ingress.baseHost) | indent 4 }}
---
# Login/registration theme "de-lab" (landing-page colours) — copies of
# common/keycloak/themes/de-lab/login/*, mounted into /opt/keycloak/themes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  theme.properties: |
{{ .Files.Get "files/keycloak/theme/theme.properties" | indent 4 }}
  de-lab.css: |
{{ .Files.Get "files/keycloak/theme/de-lab.css" | indent 4 }}
  de-bg.svg: |
{{ .Files.Get "files/keycloak/theme/de-bg.svg" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "keycloak") | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # start-dev: no TLS/build step needed for a lab; data lives in Postgres.
          # --import-realm creates de-lab on first start and skips it afterwards.
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_DB_PASSWORD, value: keycloak }
            - { name: KC_HOSTNAME, value: "http://auth.{{ .Values.ingress.baseHost }}" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.keycloak.adminUser | quote }} }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: {{ .Values.keycloak.adminPassword | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits:   { memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: theme, mountPath: /opt/keycloak/themes/de-lab/login, readOnly: true }
      volumes:
        - { name: realm, configMap: { name: keycloak-realm } }
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: de-lab.css, path: resources/css/de-lab.css }
              - { key: de-bg.svg, path: resources/img/de-bg.svg }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "keycloak") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: auth.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8080 } }
{{- end }}
{{- end }}
