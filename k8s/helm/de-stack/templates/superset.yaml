{{- if .Values.superset.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "superset") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "superset") | nindent 8 }}
      annotations:
        {{- include "de-stack.labChecksum" . | nindent 8 }}
    spec:
      volumes:
        - { name: lab-code, configMap: { name: lab-code } }
      containers:
        - name: superset
          image: {{ include "de-stack.image" (dict "root" $ "repo" .Values.superset.repo "tag" .Values.superset.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: SUPERSET_SECRET_KEY, value: "your_secret_key" }
            - { name: PG_SUPERSET_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-superset-password } } }
            - { name: SUPERSET_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: superset-admin-password } } }
            # Superset's own metadata DB (superset_config.py reads SUPERSET_METADATA_DB_URI)
            - { name: SUPERSET_METADATA_DB_URI, value: "postgresql+psycopg2://superset:$(PG_SUPERSET_PASSWORD)@postgres:5432/superset" }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: CELERY_BROKER_URL, value: "redis://redis:6379/0" }
            - { name: CELERY_RESULT_BACKEND, value: "redis://redis:6379/0" }
            - { name: CSRF_ENABLED, value: "False" }
            - { name: WTF_CSRF_ENABLED, value: "False" }
            - { name: TALISMAN_ENABLED, value: "False" }
            {{- if .Values.keycloak.enabled }}
            # Sign in with the lab account (Keycloak, client superset) — see superset_config.py
            - { name: KEYCLOAK_ENABLED, value: "1" }
            {{- end }}
          command:
            - /bin/bash
            - -c
            - >
              superset db upgrade &&
              superset fab create-admin --username {{ .Values.superset.adminUser }} --firstname Superset --lastname Admin --email admin@superset.com --password "$SUPERSET_ADMIN_PASSWORD" &&
              superset init && python /extras/connections.py &&
              superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
          volumeMounts:
            - { name: lab-code, mountPath: /app/pythonpath/superset_config.py, subPath: superset_config.py }
            - { name: lab-code, mountPath: /extras/connections.py, subPath: connections.py }
          ports:
            - { name: http, containerPort: 8088 }
          readinessProbe:
            httpGet: { path: /health, port: 8088 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "superset") | nindent 4 }}
  ports:
    - { name: http, port: 8088, targetPort: 8088 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superset
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: superset.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: superset, port: { number: 8088 } }
{{- end }}
{{- end }}
