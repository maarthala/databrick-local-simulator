# =============================================================================
# de-stack — values
# Service names intentionally match the compose service names so the embedded
# config files resolve (minio, hive-metastore, trino, iceberg-rest, ...).
# =============================================================================
global:
  # Registry holding our custom images (push with helm/de-stack/push-images.sh).
  imageRegistry: ghcr.io/maarthala/de-stack
  storageClass: microk8s-hostpath
  imagePullPolicy: IfNotPresent

# Git integration — read-only git-sync of ONE shared repo into Airflow (DAGs + src)
# and Jupyter (workspace). Devs clone/edit/push locally with their own creds; the
# cluster only READS via HTTPS + a read-only token (deploy keys are disabled by the
# org policy, so we use a fine-grained PAT / GitHub App token instead).
# Create the token Secret with:
#   kubectl -n de-stack create secret generic de-stack-git-token --from-literal=token=<PAT>
git:
  enabled: true              # requires the tokenSecret to exist (see below)
  repoUrl: "https://github.com/dev-epireum-com/de-lab.git"  # HTTPS
  branch: main
  dagsPath: dags             # subdir in the repo holding Airflow DAGs
  srcPath: src               # subdir added to PYTHONPATH (shared library code)
  syncPeriodSeconds: 30
  username: x-access-token   # GitHub PAT: any non-empty value; App token: x-access-token
  tokenSecret: de-stack-git-token  # Secret with the token under key "token"
  image: registry.k8s.io/git-sync/git-sync:v4.4.0
  # Jupyter auto-push on save: instead of the read-only git-sync mount, Jupyter
  # clones the repo into a WRITABLE dir and pushes every save. Requires the
  # tokenSecret PAT to have WRITE (contents:write) scope. Airflow keeps using
  # the read-only git-sync sidecar for DAGs regardless of this flag.
  autopush: true

ingress:
  enabled: true
  className: public          # MicroK8s nginx ingress addon IngressClass
  # UIs are exposed as <service>.<baseHost>. A Pi-hole wildcard
  # (address=/de.lan/<node-ip>) resolves them all with no per-service records.
  baseHost: de.lan

# ------------------------------------------------------------------ commodity
postgres:
  enabled: true
  # Point the "postgres" Service at an external DB (IP) instead of running one
  # in-cluster. Empty string = run the in-cluster Deployment (default: self-contained).
  # Set to an IP (e.g. "192.168.1.3") to use an external Postgres instead.
  external: ""
  image: postgres:15
  storage: 5Gi
  user: postgres
  password: postgres

redis:
  enabled: true
  image: redis:7

minio:
  enabled: true
  image: minio/minio:latest
  mcImage: minio/mc:latest
  storage: 10Gi
  rootUser: minioadmin
  rootPassword: minioadmin

# ------------------------------------------------------------------ lakehouse
# Apache Polaris — Iceberg-native governed catalog (the live governance solution).
# Persistence in Postgres (db polarisdb), MinIO storage with static creds. Console
# UI is a local build. Images are imported to the node (kubelet pulls corrupt
# containerd snapshots on this LXC):
#   docker save apache/polaris:latest | ssh sysadmin@<node> microk8s images import /dev/stdin
polaris:
  enabled: true
  image: apache/polaris:latest
  adminImage: apache/polaris-admin-tool:latest
  consoleImage: apache/polaris-console:latest

trino:
  enabled: true
  image: trinodb/trino:473

# ------------------------------------------------------------------ compute
spark:
  enabled: true
  repo: spark
  tag: latest
  workers: 1
  # Pin spark-master/worker to specific node(s). Empty = schedule anywhere.
  # e.g. { de-stack/spark: "true" } after labelling a dedicated node.
  nodeSelector: {}

# Spark Connect server (reuses the spark image) — the gRPC engine that the thin
# Jupyter client drives at sc://spark-connect:15002.
sparkConnect:
  enabled: true

# ------------------------------------------------------------------ orchestration / apps
airflow:
  enabled: true
  # Slim image (no baked-in Spark); Spark jobs run in separate pods via
  # KubernetesPodOperator. Much smaller/faster to schedule than the fat image.
  repo: airflow-slim
  tag: latest
  adminUser: airflow
  adminPassword: airflow
  # Shared keys so apiserver/scheduler/dag-processor agree (from the compose cfg).
  fernetKey: "gZg3prHNcfcl0KS9NH_Sane7PLxC0crWcoruuuBdfp4="
  secretKey: "l7sViEv3ImrPg7KW5fwwvA=="
jupyter:
  enabled: true
  repo: jupyter
  tag: latest
  token: "123456"

# ------------------------------------------------------------------ UIs
superset:
  enabled: true
  repo: superset
  tag: latest
  adminUser: admin
  adminPassword: admin
hue:
  enabled: false             # dropped — Superset's SQL Lab covers ad-hoc SQL
  repo: hue
  tag: latest
home:
  enabled: true
  # Bakes the built training site under /training/ (see common/dockerfiles/Dockerfile.home).
  # The home-html ConfigMap still supplies index.html, rewritten to the ingress hosts.
  image: ghcr.io/maarthala/de-stack/home:latest
