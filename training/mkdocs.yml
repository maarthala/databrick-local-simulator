site_name: Data Engineering — Hands-on with a Governed Lakehouse
site_description: Learn Data Engineering by building a real Bronze→Silver→Gold pipeline for the ShopFlow e-commerce company, then map every skill to Databricks, Snowflake, Fabric, and Azure.
site_url: https://maarthala.github.io/databrick-local-simulator/
repo_url: https://github.com/maarthala/databrick-local-simulator
repo_name: maarthala/databrick-local-simulator
copyright: >
  <a href="https://github.com/maarthala/databrick-local-simulator" target="_blank" rel="noopener">⭐ View this project on GitHub</a>
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maarthala/databrick-local-simulator
      name: Project on GitHub

nav:
  - Home: index.md
  - Getting started:
      - "Prerequisites & setup": setup/prerequisites.md
      - "Bring up the stack": setup/deploy.md
      - "Personas & roles": setup/personas.md
      - The ShopFlow scenario: scenario.md
      - "0 · Technical architecture": unit0/architecture.md
      - "0.1 · Database schema": unit0/schema.md
  - "1 · Foundations":
      - "1.1 What is Data Engineering": unit1/what-is-de.md
      - "1.2 Lake vs Warehouse vs Lakehouse": unit1/lakehouse.md
      - "1.3 File & table formats": unit1/formats.md
      - "1.4 Medallion architecture": unit1/medallion.md
  - "2 · SQL on big data":
      - "2.1 Query the lake with Trino": unit2/intro.md
      - "2.2 Joins & aggregations": unit2/joins-aggregations.md
      - "2.3 Window functions": unit2/window-functions.md
      - "2.4 CTEs & complex analytics": unit2/ctes.md
      - "2.5 Conditional logic, NULLs & filtering": unit2/conditional.md
      - "2.6 MERGE & upserts": unit2/merge.md
      - "2.7 Semi-structured data (JSON)": unit2/json.md
      - "2.8 Challenge: cohort report": unit2/challenge.md
  - "3 · Python — Notebook":
      - "3.1 Python & notebooks for DE": unit3/python-essentials.md
      - "3.2 pandas": unit3/pandas.md
      - "3.3 NumPy": unit3/numpy.md
      - "3.4 PyArrow & Parquet": unit3/pyarrow.md
      - "3.5 Consuming APIs (requests)": unit3/apis.md
      - "3.6 SQL from Python (Postgres & lakehouse)": unit3/databases.md
      - "3.7 Spark from a notebook": unit3/spark.md
  - "4 · Spark":
      - "4.1 Spark fundamentals": unit4/fundamentals.md
      - "4.2 Read the lake (Bronze)": unit4/read-bronze.md
      - "4.3 Transform to Silver": unit4/transform-silver.md
      - "4.4 Spark SQL & aggregates (Gold)": unit4/spark-sql-gold.md
      - "4.5 Challenge: build a Gold mart": unit4/challenge.md
  - "5 · Orchestration (Airflow)":
      - "5.1 Airflow basics": unit5/basics.md
      - "5.2 Build the medallion DAG": unit5/medallion-dag.md
      - "5.3 Schedule ingestion & Spark jobs": unit5/schedule.md
  - "6 · Data governance (Unity Catalog)":
      - "6.1 Catalogs, schemas, tables": unit6/catalogs.md
      - "6.2 Users, roles & RBAC": unit6/rbac.md
      - "6.3 Discovery & search": unit6/discovery.md
  - "7 · Business intelligence (Superset)":
      - "7.1 Dashboards from the Gold layer": unit7/dashboards.md
  - Capstones:
      - "Capstone 1 (easy)": capstones/capstone-1.md
      - "Capstone 2 (medium)": capstones/capstone-2.md
  - Bridge to the platforms:
      - "OSS ⇄ Databricks / Snowflake / Fabric / Azure": platforms/rosetta.md
      - Glossary: platforms/glossary.md
