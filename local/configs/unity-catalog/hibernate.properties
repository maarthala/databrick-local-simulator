# Unity Catalog metadata store — Postgres (shared `postgres` service, db `ucdb`).
# Bind-mounted over the image's default (which points at embedded H2). Hibernate
# auto-creates/updates its schema on boot (hbm2ddl.auto=update), so `ucdb` only
# needs to exist and be owned by `ucuser`; UC builds the tables itself.
hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://postgres:5432/ucdb
hibernate.connection.user=ucuser
hibernate.connection.password=ucuser

hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
org.hibernate.type.descriptor.sql.BasicBinder=TRACE
