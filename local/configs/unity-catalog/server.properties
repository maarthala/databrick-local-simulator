server.env=dev
server.authorization=enable
# External OIDC (Keycloak). Issuer host `keycloak` must resolve for BOTH the UC
# container (compose DNS) and the browser (add `127.0.0.1 keycloak` to /etc/hosts).
server.authorization-url=http://keycloak:8080/realms/de-stack/protocol/openid-connect/auth
server.token-url=http://keycloak:8080/realms/de-stack/protocol/openid-connect/token
server.client-id=unity-catalog
server.client-secret=unity-catalog-secret
server.allowed-issuers=http://keycloak:8080/realms/de-stack
server.audiences=unity-catalog,unity-catalog-ui
# MinIO (S3) — patched UC image vends these static keys directly (no STS).
s3.bucketPath.0=s3://demo-bucket
s3.region.0=us-east-1
s3.accessKey.0=minioadmin
s3.secretKey.0=minioadmin
