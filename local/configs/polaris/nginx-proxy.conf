# Same-origin front for the Polaris Console: serves the UI at / and proxies the
# Polaris API at /api/ — so the browser makes only same-origin calls (no CORS).
server {
    listen 8189;
    server_name _;

    location /api/ {
        proxy_pass http://polaris:8181/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://polaris-console:8080/;
        proxy_set_header Host $host;
    }
}
