
services:
  jupyter:
    container_name: jupyter
    restart: always
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.jupyter
    ports:
      - "8008:8888"
    volumes:
      - ./code:/code
      - ./code/notebook:/home/jovyan/work
      # NOTE: do NOT mount a file into /home/jovyan/.jupyter — it makes that dir root-owned
      # and jupyter-core's config migration then crashes on a PermissionError. Token/CORS are
      # already set via the container's CLI flags.
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=123456
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
      # --- Auto-push on save (same repo/token as k8s) ---
      # All configured via local/.env (copy from .env.example; .env is gitignored,
      # so the token never lands in git). The entrypoint clones GIT_REPO_URL into
      # /home/jovyan/work/repo; notebooks saved under notebooks/ are committed +
      # pushed on every save. Blank GIT_TOKEN = auto-push disabled.
      - GIT_AUTOPUSH=${GIT_AUTOPUSH:-1}
      - GIT_REPO_URL=${GIT_REPO_URL:-https://github.com/dev-epireum-com/de-lab.git}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_USERNAME=${GIT_USERNAME:-x-access-token}
      - GIT_TOKEN=${GIT_TOKEN:-}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-notebook}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-notebook@de.lan}
    networks:
      - sparknet