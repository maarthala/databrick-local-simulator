
services:
  # S3-compatible object storage (replaces LocalStack). Console UI at :9001.
  minio:
    container_name: minio
    # MinIO stopped publishing community images and deleted minio/minio + minio/mc from
    # Docker Hub (2026-09). These are unmodified mirrors of the last releases (AGPL-3.0,
    # source: github.com/minio/minio) — frozen: no further upstream fixes.
    image: ghcr.io/maarthala/de-stack/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # "Login with SSO" (Keycloak realm de-lab, client minio). The token's `policy` claim =
      # the user's group → MinIO policy learners (only <username>-lake) / instructors (all);
      # policies are created by minio-init. Discovery is fetched on the internal address;
      # Keycloak returns the browser-facing login URL in it.
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/de-lab/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: minio-secret
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
      MINIO_IDENTITY_OPENID_SCOPES: openid,profile
      MINIO_IDENTITY_OPENID_REDIRECT_URI: http://localhost:9001/oauth_callback
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Epireum lab account
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9002:9000"   # S3 API  (9000 is taken by ClickHouse on the host)
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sparknet

  # One-shot: waits for MinIO, then creates the demo buckets and uploads the
  minio-init:
    container_name: minio-init
    image: ghcr.io/maarthala/de-stack/mc:RELEASE.2025-08-13T08-35-41Z   # mirror, see minio above
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init_scripts/setup.sh"]
    volumes:
      - ./code:/code
      - ./init_scripts/minio:/init_scripts
    restart: "no"
    networks:
      - sparknet

  # Apache Iceberg REST catalog. Spark and Trino both talk to it over HTTP (:8181).
  # Catalog metadata is persisted in a SQLite file on a volume; table data lives
  # in MinIO (s3://demo-bucket/iceberg/). Runs as root so it can write /persist.
  trino:
    image: trinodb/trino:483
    restart: always
    container_name: trino
    ports:
      - "8007:8080"
    volumes:
      - ./configs/trino:/etc/trino
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      - sparknet

volumes:
  minio-data:
