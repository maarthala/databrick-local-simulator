services:
  # OIDC identity provider (single sign-on) for Unity Catalog. Dev mode, realm
  # re-imported on start (users analyst/engineer/lead). Reachable at http://keycloak:8080 from
  # both containers (compose DNS) and the browser (add `127.0.0.1 keycloak` to
  # /etc/hosts) so the token issuer is identical inside and outside compose.
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./configs/keycloak/de-stack-realm.json:/opt/keycloak/data/import/de-stack-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - sparknet
