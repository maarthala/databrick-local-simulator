services:
  # Apache Polaris — Iceberg-native governed REST catalog (RBAC + credential
  # vending). SPIKE: evaluated alongside Unity Catalog to teach the full catalog
  # concept for BOTH Trino and Spark on the existing Iceberg lakehouse.
  # In-memory persistence for now (metadata resets on restart; MinIO data persists).
  polaris:
    image: apache/polaris:latest
    container_name: polaris
    ports:
      - "8185:8181"   # catalog + management REST API (host :8185)
      - "8186:8182"   # health / metrics
    environment:
      # MinIO static credentials (no STS — enabled by ALLOW_INSECURE_STORAGE_TYPES).
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # realm + bootstrap root principal (client-id=root, client-secret=s3cr3t).
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
      # --- Keycloak OIDC (mixed realm: accepts Polaris-internal AND Keycloak tokens) ---
      polaris.authentication."POLARIS".type: mixed
      quarkus.oidc.tenant-enabled: "true"
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/de-stack
      quarkus.oidc.client-id: polaris
      quarkus.oidc.credentials.secret: polaris-secret
      quarkus.oidc.roles.role-claim-path: principal_roles
      polaris.oidc.principal-mapper.name-claim-path: principal_name
      polaris.oidc.principal-roles-mapper.mappings[0].regex: (.+)
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: "PRINCIPAL_ROLE:$1"
      # CORS — let the browser-based Console (:8188) call the API (:8185).
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:8188"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD"
      QUARKUS_HTTP_CORS_HEADERS: "Authorization,Content-Type,Polaris-Realm,X-Iceberg-Access-Delegation"
      # --- Durable persistence: Postgres (db polarisdb) instead of in-memory ---
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polarisdb
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 10s
      retries: 6
    depends_on:
      postgres:
        condition: service_started
      polaris-bootstrap:
        condition: service_completed_successfully
    networks:
      - sparknet

  # One-shot: bootstrap the Polaris schema + realm into Postgres (runs before polaris).
  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    container_name: polaris-bootstrap
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polarisdb
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - sparknet

  # Polaris Console — the web UI (built from apache/polaris-tools; no official
  # image yet). The VITE_* API URL is baked at build time to the browser-reachable
  # Polaris port (localhost:8185). Browse at http://localhost:8188.
  polaris-console:
    image: apache/polaris-console:latest
    container_name: polaris-console
    expose:
      - "8080"
    environment:
      # Read at container start to generate /config.js (window.APP_CONFIG).
      # API is same-origin via the proxy (:8189); OIDC = Keycloak SSO.
      VITE_POLARIS_API_URL: http://localhost:8189
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_OAUTH_TOKEN_URL: http://localhost:8189/api/catalog/v1/oauth/tokens
      VITE_POLARIS_REALM_HEADER_NAME: Polaris-Realm
      VITE_OIDC_ISSUER_URL: http://keycloak:8080/realms/de-stack
      VITE_OIDC_CLIENT_ID: polaris-ui
      VITE_OIDC_REDIRECT_URI: http://localhost:8189/auth/callback
      VITE_OIDC_SCOPE: "openid profile"
    depends_on:
      - polaris
    networks:
      - sparknet

  # Same-origin front: serves the Console at / and proxies the API at /api/, so
  # the browser makes only same-origin calls (works around Polaris's fixed CORS).
  # Access the UI at http://localhost:8189.
  polaris-proxy:
    image: nginx:alpine
    container_name: polaris-proxy
    ports:
      - "8189:8189"
    volumes:
      - ./configs/polaris/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - polaris
      - polaris-console
    networks:
      - sparknet
