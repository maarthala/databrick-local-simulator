
services:
  nginx:
    image: nginx:1.31.5
    container_name: home
    # No published port: the landing page is served through oauth2-proxy on :8000
    # (keycloak.yaml), so it's only reachable after a Keycloak login.
    restart: always
    volumes:
      - ./home:/usr/share/nginx/html:ro
      - ./configs/home/default.conf:/etc/nginx/conf.d/default.conf:ro   # bigger header limit (sign-in cookies)
      # The course is on GitHub Pages (the landing page links there) — not served
      # by the stack, so no training/site mount. Preview locally with `make docs-serve`.
    depends_on:
      - airflow-apiserver
      - superset
      - trino
      - jupyter
      - spark-master
      - storage
    networks:
      - sparknet