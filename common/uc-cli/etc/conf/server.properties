# Mac-side OAuth config for the `uc` CLI's interactive `uc auth login` flow.
# The CLI reads etc/conf/server.properties RELATIVE TO THE CURRENT DIRECTORY,
# so run `uc auth login` from tools/uc-cli/ (or copy this file next to where you run).
#
# Login as a Keycloak user (analyst/analyst, engineer/engineer, or lead/lead):
#   cd tools/uc-cli
#   uc --server http://uc.de.lan:30808 auth login --output jsonPretty
# The browser opens Keycloak -> after login you get a UC access token. Then:
#   export T=<access_token>
#   uc --server http://uc.de.lan:30808 --auth_token "$T" catalog list

server.authorization-url=http://auth.de.lan/realms/de-stack/protocol/openid-connect/auth
server.token-url=http://auth.de.lan/realms/de-stack/protocol/openid-connect/token
server.client-id=unity-catalog
server.client-secret=unity-catalog-secret
# Fixed redirect port so it matches the redirect URI registered in the realm.
server.redirect-port=8989
